apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: restore-facilities-app
spec:
  params:
    - default: ''
      description: COS apikey
      name: apikey
      type: string
    - default: ''
      description: IBM Cloud Object Storage resource instance ID (CRN)
      name: resource-id
      type: string
    - default: 'https://s3.us.cloud-object-storage.appdomain.cloud'
      description: S3 endpoint URL
      name: endpoint
      type: string
    - default: ''
      description: Optional prefix to filter objects
      name: object-prefix
      type: string
    - default: mas1
      name: mas-instance-id
      type: string
    - default: ws1
      name: mas-workspace-id
      type: string
    - default: workspace
      name: mas-workspace-name
      type: string
    - default: db2u
      description: Namespace where DB2 is deployed
      name: db2-namespace
      type: string
    - default: /mnt/backup
      description: Download directory inside DB2 pod
      name: download-dir
      type: string
  steps:
    - computeResources: {}
      image: 'quay.io/openshift/origin-cli:4.16'
      name: get-facilities-backup
      script: |
        #!/usr/bin/env bash

        ################################################################################
        # IBM Cloud Object Storage Backup Download to DB2 Pod
        ################################################################################

        set -e

        # Configuration from parameters
        APP="facilities"
        APP_BUCKET_NAME="techzone-mref"
        RESOURCE_ID="$(params.resource-id)"
        ENDPOINT="$(params.endpoint)"
        OBJECT_PREFIX="$(params.object-prefix)"
        DB2_NAMESPACE="$(params.db2-namespace)"
        DB2_POD_NAME="c-mas-$(params.mas-instance-id)-$(params.mas-workspace-id)-$APP-db2u-0"
        DOWNLOAD_DIR="$(params.download-dir)"

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] IBM Cloud Object Storage Backup Download to DB2 Pod"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Starting download process..."

        # Validate configuration
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Validating configuration..."
        [[ -z "$APP" ]] && { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: Application name is not set" >&2; exit 1; }
        [[ -z "$RESOURCE_ID" ]] && { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: RESOURCE_ID is not set" >&2; exit 1; }
        [[ -z "$ENDPOINT" ]] && { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: ENDPOINT is not set" >&2; exit 1; }
        [[ -z "$DB2_NAMESPACE" ]] && { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: DB2 namespace is not set" >&2; exit 1; }

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Configuration validated"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Application: $APP"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Bucket: $APP_BUCKET_NAME"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] DB2 Namespace: $DB2_NAMESPACE"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Download directory: $DOWNLOAD_DIR"

        # Authenticate to IBM Cloud
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Authenticating to IBM Cloud..."

        IBMCLOUD_API_KEY="$(params.apikey)"
        [[ -z "$IBMCLOUD_API_KEY" ]] && { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: Failed to retrieve IBM Cloud API key from secret" >&2; exit 1; }

        auth_response=$(curl -s -X POST "https://iam.cloud.ibm.com/identity/token" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "apikey=${IBMCLOUD_API_KEY}" \
            --data-urlencode "response_type=cloud_iam" \
            --data-urlencode "grant_type=urn:ibm:params:oauth:grant-type:apikey")

        ACCESS_TOKEN=$(echo "$auth_response" | grep -o '"access_token":"[^"]*' | grep -o '[^"]*$')
        [[ -z "$ACCESS_TOKEN" ]] && { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: Failed to get access token" >&2; exit 1; }

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Authentication successful"

        # Verify bucket exists
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Verifying bucket: $APP_BUCKET_NAME"

        response=$(curl -s "$ENDPOINT/" \
            -H "Authorization: bearer ${ACCESS_TOKEN}" \
            -H "ibm-service-instance-id: ${RESOURCE_ID}")

        if ! echo "$response" | xmllint --xpath "//*[local-name()='Bucket']/*[local-name()='Name']/text()" - 2>/dev/null | grep -q "^${APP_BUCKET_NAME}$"; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: Bucket '$APP_BUCKET_NAME' not found" >&2
            exit 1
        fi

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Bucket verified"

        # Get DB2 pod
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Getting DB2 pod in namespace: $DB2_NAMESPACE"
        DB2_POD=$(oc get pods -n "$DB2_NAMESPACE" "$DB2_POD_NAME" -o name)

        if [[ -z "$DB2_POD" ]]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: DB2 pod not found with name: $DB2_POD_NAME" >&2
            exit 1
        fi

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Found DB2 pod: $DB2_POD"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Executing download inside DB2 pod..."

        # Execute download script inside DB2 pod
        oc exec -i "$DB2_POD" -n "$DB2_NAMESPACE" -- bash <<DOWNLOAD_SCRIPT
        set -e
        su - db2inst1

        # Export variables to DB2 pod environment
        export ACCESS_TOKEN='$ACCESS_TOKEN'
        export ENDPOINT='$ENDPOINT'
        export APP_BUCKET_NAME='$APP_BUCKET_NAME'
        export OBJECT_PREFIX='$OBJECT_PREFIX'
        export DOWNLOAD_DIR='$DOWNLOAD_DIR'

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Starting download in DB2 pod"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Bucket: \$APP_BUCKET_NAME"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Download directory: \$DOWNLOAD_DIR"

        # List and download objects
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Listing objects in bucket: \$APP_BUCKET_NAME"

        marker=""
        is_truncated="true"
        total_count=0

        while [[ "\$is_truncated" == "true" ]]; do
            # Build URL with optional prefix and marker
            url="\$ENDPOINT/\$APP_BUCKET_NAME?max-keys=1000"
            [[ -n "\$OBJECT_PREFIX" ]] && url="\${url}&prefix=\${OBJECT_PREFIX}"
            [[ -n "\$marker" ]] && url="\${url}&marker=\${marker}"
            
            # Get object list
            response=\$(curl -s "\$url" -H "Authorization: bearer \${ACCESS_TOKEN}")
            
            # Check if more pages exist
            is_truncated=\$(echo "\$response" | xmllint --xpath '//*[local-name()="IsTruncated"]/text()' - 2>/dev/null || echo "false")
            
            # Get next marker if truncated
            if [[ "\$is_truncated" == "true" ]]; then
                marker=\$(echo "\$response" | xmllint --xpath '//*[local-name()="NextMarker"]/text()' - 2>/dev/null)
            fi
            
            # Parse and download objects
            object_count=\$(echo "\$response" | xmllint --xpath 'count(//*[local-name()="Contents"])' - 2>/dev/null)
            
            for ((i=1; i<=object_count; i++)); do
                key=\$(echo "\$response" | xmllint --xpath "//*[local-name()='Contents'][\$i]/*[local-name()='Key']/text()" - 2>/dev/null)
                size=\$(echo "\$response" | xmllint --xpath "//*[local-name()='Contents'][\$i]/*[local-name()='Size']/text()" - 2>/dev/null)
                
                # Download object
                filename=\$(basename "\$key")
                filepath="\$DOWNLOAD_DIR/\$filename"
                
                # Skip if already exists with same size
                if [[ -f "\$filepath" ]]; then
                    existing_size=\$(stat -c%s "\$filepath" 2>/dev/null)
                    if [[ "\$existing_size" == "\$size" ]]; then
                        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Skipping (already exists): \$filename"
                        ((total_count++))
                        continue
                    fi
                fi
                
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] Downloading: \$filename (\$size bytes)"
                
                # Download with retry
                attempt=0
                max_attempts=3
                success=false
                
                 while (( attempt < max_attempts )) && [[ "\$success" != "true" ]]; do
                    ((attempt++))
                  echo \$filepath
                   if curl -s -f -o "\$filepath" "\$ENDPOINT/\$APP_BUCKET_NAME/\$key" -H "Authorization: bearer \${ACCESS_TOKEN}"; then
                        
                        # Verify size
                        downloaded_size=\$(stat -c%s "\$filepath" 2>/dev/null)
                        if [[ "\$downloaded_size" == "\$size" ]]; then
                            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Downloaded: \$filename"
                            success=true
                        else
                            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Size mismatch, retrying: \$filename (attempt \$attempt/\$max_attempts)"
                            rm -f "\$filepath"
                            sleep 2
                        fi
                    else
                        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Download failed, retrying: \$filename (attempt \$attempt/\$max_attempts)"
                        rm -f "\$filepath"
                        sleep 2
                    fi
                done
                
                if [[ "\$success" != "true" ]]; then
                    echo "[$(date '+%Y-%m-%d %H:%M:%S')] WARNING: Failed to download after \$max_attempts attempts: \$filename"
                else
                    ((total_count++))
                fi
            done
        done

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Download complete. Total objects downloaded: \$total_count"
        DOWNLOAD_SCRIPT

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] All done!"
    - computeResources: {}
      image: 'quay.io/openshift/origin-cli:4.16'
      name: restore-facilities-app
      script: |
        #!/usr/bin/env bash
        set -e

        APP="facilities"
        DB2_NAMESPACE="$(params.db2-namespace)"
        DB2_POD_NAME="c-mas-$(params.mas-instance-id)-$(params.mas-workspace-id)-$APP-db2u-0"
        DOWNLOAD_DIR="$(params.download-dir)"

        # Get DB2 pod
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Copying script to DB2 pod $DB2_NAMESPACE"
        DB2_POD=$(oc get pods -n "$DB2_NAMESPACE" "$DB2_POD_NAME" -o name)

        if [[ -z "$DB2_POD" ]]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: DB2 pod not found with name: $DB2_POD_NAME"
            exit 1
        fi

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Found DB2 pod: $DB2_POD"
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Executing restoration inside DB2 pod..."

        oc exec -i "$DB2_POD" -n "$DB2_NAMESPACE" -- su - db2inst1 -c 'cat > ~/techzone_restore.sh' <<"EOF"
        #!/bin/bash
        set -e
        WHOAMI=$(whoami)
        echo $INST_DIR
        source $HOME/sqllib/db2profile

        exit 0
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Pod User $WHOAMI"

        export DOWNLOAD_DIR=$1
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] DEBUG: DOWNLOAD_DIR: $DOWNLOAD_DIR"

        for file in $(ls $DOWNLOAD_DIR); do
          if [[ ! $file =~ 'p12' && ! $file =~ 'sth' ]]; then
            export TIMESTAMP=$(echo $file | sed -E 's/.*\.([0-9]{14})\..*/\1/')
            if [[ ! $TIMESTAMP =~ ^[0-9]{14}$ ]]; then
              echo "ERROR: Invalid timestamp format: $TIMESTAMP"
              exit 1
            fi
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Found backup timestamp: $TIMESTAMP"
          else
            cp $DOWNLOAD_DIR/$file /mnt/blumeta0/db2/keystore/
          fi
        done

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Setting up keystore location"
        db2 update dbm cfg using KEYSTORE_LOCATION /mnt/blumeta0/db2/keystore/$(ls $DOWNLOAD_DIR | grep -i ".p12") || true

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Verifying restore image"
        cd $DOWNLOAD_DIR
        # db2ckbkp $(ls $DOWNLOAD_DIR | grep -i "BLUDB")
        # rc=$?
        rc=0
        if [[ $rc == "0" ]]; then
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Connecting to BLUDB"
          db2 connect to BLUDB || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Disconnecting Apps"
          db2 force application all || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Terminating BLUDB"
          db2 terminate
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Deactivating BLUDB"
          db2 deactivate database BLUDB || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Stoping database"
          db2stop force || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Re-starting with admin access"
          db2start admin mode restricted access
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Drop database"
          db2 drop db BLUDB || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Restore database"
          db2 RESTORE DATABASE BLUDB FROM $DOWNLOAD_DIR TAKEN AT $TIMESTAMP ON /mnt/bludata0/db2/databases ENCRYPT WITHOUT ROLLING FORWARD WITHOUT PROMPTING
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Stop and restart database"
          db2stop force
          db2start
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Activate BLUDB"
          db2 activate db bludb
        else
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Db2 check failed"
          exit 1
        fi
        EOF

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Giving permissions..."
        oc exec -i "$DB2_POD" -n "$DB2_NAMESPACE" -- su - db2inst1 <<PERMISSION_SET
        chmod 777 ~/techzone_restore.sh
        if [ -f ~/techzone_logs.log ]; then
          rm -rf techzone_logs.log
        fi
        PERMISSION_SET

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Executing script"
        oc rsh -n "$DB2_NAMESPACE" -c db2u "$DB2_POD" su - db2inst1 -c "nohup ~/techzone_restore.sh $DOWNLOAD_DIR < /dev/null > techzone_logs.log 2>&1 &"